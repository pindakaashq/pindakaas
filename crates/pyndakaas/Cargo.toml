[package]
name = "pyndakaas"
description = "Python bindings for Pindakaas constraint encodings"
version = "0.6.1"
edition = "2021"

authors.workspace = true
license.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true

[lib]
name = "pindakaas"
crate-type = ["cdylib"]

[dependencies]
itertools = "0.15"
pindakaas = { version = "0.6.1", path = "../pindakaas", features = ["kissat"] }
pyo3 = { version = "0.30.1", features = ["abi3-py39"] }

[features]
# Embed the type information that `maturin --generate-stubs` reads.
experimental-inspect = ["pyo3/experimental-inspect"]

[lints]
workspace = true
